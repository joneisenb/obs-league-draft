<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Broadcaster Sign-in</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0d1017; color: #e8ecf4; font: 14px/1.4 system-ui, sans-serif; }
    main { width: min(340px, 100% - 32px); }
    h1 { font-size: 18px; margin: 0 0 4px; }
    p { color: #8a93a8; margin: 0 0 14px; }
    form { display: grid; gap: 8px; }
    input, button { font: inherit; color: inherit; background: #0f131c; border: 1px solid #262d3d; border-radius: 6px; padding: 9px 10px; }
    button { background: #2f8cff; border: 0; font-weight: 600; cursor: pointer; }
    .err { color: #ff5a6a; } .ok { color: #3ccf7a; }
  </style>
</head>
<body>
  <main>
    <h1>📡 Draft Broadcaster</h1>
    <p id="msg">Sign in to broadcast the draft.</p>
    <form id="form" hidden>
      <input id="email" type="email" placeholder="Email" autocomplete="username" required autofocus>
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
      <button>Sign in</button>
    </form>
  </main>
  <script type="module">
    import { Auth } from '../shared/firebase.js';
    const $ = id => document.getElementById(id);
    const auth = new Auth();
    const target = new URLSearchParams(location.search).get('origin');
    const store = {
      get: k => { try { return localStorage.getItem(k); } catch { return null; } },
      set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
    };

    function done() {
      store.set('draft-refresh', auth.refreshToken);          // shared with the control panel
      if (window.opener && target) {
        window.opener.postMessage({ type: 'draft-broadcaster-login', refreshToken: auth.refreshToken }, target);
        $('msg').className = 'ok'; $('msg').textContent = 'Signed in. This window will close…';
        setTimeout(() => window.close(), 600);
      } else {
        $('msg').className = 'err';
        $('msg').textContent = 'Signed in, but this window lost its link to the drafter.lol tab. Close it and press Broadcast again.';
      }
      $('form').hidden = true;
    }

    // Already signed in on the control panel in this browser → no typing needed.
    const saved = store.get('draft-refresh');
    if (saved) auth.restore(saved).then(done).catch(() => ($('form').hidden = false));
    else $('form').hidden = false;

    $('form').onsubmit = async e => {
      e.preventDefault();
      $('msg').className = ''; $('msg').textContent = 'Signing in…';
      try { await auth.signIn($('email').value, $('password').value); done(); }
      catch (err) { $('msg').className = 'err'; $('msg').textContent = err.message.replace(/_/g, ' ').toLowerCase(); }
    };
  </script>
</body>
</html>
